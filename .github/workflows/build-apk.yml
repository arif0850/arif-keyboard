name: Build Arif Keyboard APK

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
  workflow_dispatch:
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Restore Signing Keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > debug.keystore
            echo "Restored persistent debug.keystore:"
            keytool -list -v -keystore debug.keystore -storepass android | grep "SHA256:"
          else
            echo "WARNING: KEYSTORE_BASE64 secret not set; build.sh will generate an ephemeral keystore."
          fi

      - name: Install Apktool and configure Android Build-Tools
        run: |
          BUILD_TOOLS_DIR=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          echo "Using build-tools: $BUILD_TOOLS_DIR"
          echo "$BUILD_TOOLS_DIR" >> $GITHUB_PATH

          mkdir -p "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> $GITHUB_PATH

          APKTOOL_VER="3.0.3"
          curl -sSL "https://github.com/iBotPeaches/Apktool/releases/download/v${APKTOOL_VER}/apktool_${APKTOOL_VER}.jar" -o "$HOME/.local/bin/apktool.jar"
          cat << 'EOF' > "$HOME/.local/bin/apktool"
          #!/usr/bin/env bash
          exec java -Xmx2048M -jar "$HOME/.local/bin/apktool.jar" "$@"
          EOF
          chmod +x "$HOME/.local/bin/apktool" "$HOME/.local/bin/apktool.jar"

      - name: Build, Align, and Sign APK
        run: |
          bash build.sh
          ls -lh dist/arif-keyboard-final.apk

      - name: Upload Signed APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: arif-keyboard-final-apk
          path: dist/arif-keyboard-final.apk
          retention-days: 30

      - name: Publish / Update Latest GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          COMMIT_SHA=$(git rev-parse --short HEAD)
          COMMIT_MSG=$(git log -1 --pretty=%s)
          CERT_SHA256=$(apksigner verify --print-certs dist/arif-keyboard-final.apk | grep "SHA-256 digest" | head -n 1 | awk '{print $NF}')

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f latest HEAD
          git push -f origin latest

          NOTES=$(cat <<EOF
Auto-built standalone APK from \`main\` (\`${COMMIT_SHA}\`): ${COMMIT_MSG}

- **Package**: \`com.arif.keyboard\`
- **Signing Certificate SHA-256**: \`${CERT_SHA256}\`
- **Direct Update Compatible**: Signed with the same persistent keystore as your device build.
EOF
          )

          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest dist/arif-keyboard-final.apk --clobber
            gh release edit latest --title "Arif Keyboard Latest (${COMMIT_SHA})" --notes "$NOTES"
          else
            gh release create latest dist/arif-keyboard-final.apk --target main --title "Arif Keyboard Latest (${COMMIT_SHA})" --notes "$NOTES"
          fi
