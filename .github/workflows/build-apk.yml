name: Build Arif Keyboard APK

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
  workflow_dispatch:
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Apktool and configure Android Build-Tools
        run: |
          BUILD_TOOLS_DIR=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          echo "Using build-tools: $BUILD_TOOLS_DIR"
          echo "$BUILD_TOOLS_DIR" >> $GITHUB_PATH

          mkdir -p "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> $GITHUB_PATH

          APKTOOL_VER="3.0.3"
          curl -sSL "https://github.com/iBotPeaches/Apktool/releases/download/v${APKTOOL_VER}/apktool_${APKTOOL_VER}.jar" -o "$HOME/.local/bin/apktool.jar"
          cat << 'EOF' > "$HOME/.local/bin/apktool"
          #!/usr/bin/env bash
          exec java -Xmx2048M -jar "$HOME/.local/bin/apktool.jar" "$@"
          EOF
          chmod +x "$HOME/.local/bin/apktool" "$HOME/.local/bin/apktool.jar"

      - name: Build, Align, and Sign APK
        run: |
          bash build.sh
          ls -lh dist/arif-keyboard-final.apk

      - name: Upload Signed APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: arif-keyboard-final-apk
          path: dist/arif-keyboard-final.apk
          retention-days: 30
